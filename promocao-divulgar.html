<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divulgar Promoção — Curió Promos</title>

  <!-- PWA / App Mobile -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Curió Promos">
  <link rel="apple-touch-icon" href="assets/img/curio.png">
  <meta name="theme-color" content="#0F2A4A">

  <link rel="icon" type="image/png" href="assets/img/curio.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
          <img src="assets/img/curio.png" alt="Curió Promos">

      </div>
      <nav class="sidebar-nav">
        <a href="index.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="promocoes.html" class="ativo"><i data-lucide="tag"></i> Promoções</a>
        <a href="categorias.html"><i data-lucide="folder"></i> Categorias</a>
        <a href="lojas.html"><i data-lucide="store"></i> Lojas</a>
        <a href="templates.html"><i data-lucide="message-square"></i> Templates</a>
        <a href="historico.html"><i data-lucide="history"></i> Histórico</a>
        <a href="backup.html"><i data-lucide="database"></i> Backup</a>
        <a href="configuracoes.html"><i data-lucide="settings"></i> Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <span class="user-email" id="user-email">—</span>
        </div>
        <button class="btn btn-ghost btn-sm btn-block" style="color:rgba(255,255,255,0.7);" id="btn-logout">
          <i data-lucide="log-out"></i> Sair
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menu-toggle"><i data-lucide="menu"></i></button>
          <a href="promocoes.html" class="btn btn-ghost btn-sm"><i data-lucide="arrow-left"></i></a>
          <span class="topbar-title">Divulgar promoção</span>
        </div>
      </header>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 id="titulo-produto">Carregando...</h1>
            <p class="text-muted" id="subtitulo-produto"></p>
          </div>
        </div>

        <div class="grid-divulgar">
          <!-- COLUNA ESQUERDA -->
          <div class="card">
            <h3 style="margin-bottom:1rem;font-size:1rem;">Configuração</h3>

            <div class="form-group">
              <label for="select-template">Modelo de mensagem</label>
              <select id="select-template" class="form-control"></select>
            </div>

            <div class="form-group">
              <label for="mensagem-editavel">Mensagem (editável)</label>
              <textarea id="mensagem-editavel" class="form-control" rows="16" style="font-family:inherit;"></textarea>
              <span class="text-small text-muted">Ajuste livremente antes de enviar.</span>
            </div>

            <div class="flex gap-sm" style="flex-wrap:wrap;">
              <button class="btn btn-outline" id="btn-copiar">
                <i data-lucide="copy"></i> Copiar
              </button>
              <button class="btn btn-whatsapp" id="btn-whatsapp" style="flex:1;">
                <i data-lucide="message-circle"></i> Abrir WhatsApp
              </button>
              <button class="btn btn-outline" id="btn-imagem" title="Exportar card como imagem">
                <i data-lucide="image"></i> Imagem
              </button>
            </div>
          </div>

          <!-- COLUNA DIREITA -->
          <div class="card">
            <h3 style="margin-bottom:1rem;font-size:1rem;">Pré-visualização</h3>
            <div id="preview-promocao" style="margin-bottom:1rem;"></div>
            <div style="background:#E5DDD5;border-radius:var(--raio-sm);padding:0.75rem;">
              <div id="preview-mensagem"
                   style="background:#DCF8C6;padding:0.75rem;border-radius:8px;white-space:pre-wrap;word-break:break-word;font-size:0.875rem;color:#1E293B;max-height:400px;overflow-y:auto;">
                Selecione um template...
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- CARD OCULTO PARA EXPORTAR COMO IMAGEM -->
  <div id="card-preview">
    <div class="card-preview-header">
      <span class="card-preview-logo">🐦</span>
      <span class="card-preview-brand">CURIÓ PROMOS</span>
    </div>
    <div class="card-preview-comment" id="cp-comment"></div>
    <div class="card-preview-title" id="cp-title"></div>
    <div class="card-preview-img-wrap" id="cp-img-wrap"></div>
    <div class="card-preview-prices">
      <div class="card-preview-old" id="cp-old"></div>
      <div class="card-preview-new" id="cp-new"></div>
      <div class="card-preview-pix" id="cp-pix" style="display:none;"></div>
    </div>
    <div class="card-preview-coupon" id="cp-coupon" style="display:none;"></div>
    <div class="card-preview-cta" id="cp-cta">👉 LINK NA DESCRIÇÃO / COMENTÁRIO</div>
    <div class="card-preview-footer">Oferta sujeita a alteração de preço</div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/divulgacao.js"></script>
  <script src="js/promocao-divulgar.js"></script>
  <script>
    CurioAuth.protegerPagina().then(async (user) => {
      if (!user) return;
      document.getElementById('user-email').textContent = user.email;
      document.getElementById('user-avatar').textContent = user.email.charAt(0).toUpperCase();
      document.getElementById('btn-logout').onclick = () => CurioAuth.logout();
      await CurioDivulgar.init();
    });
  </script>
</body>
</html>
